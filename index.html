<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LutraTally（随时记）隐私政策与技术支持">
  <title>LutraTally · 支持与隐私</title>
  <style>
    :root { color-scheme: light dark; --ink:#172033; --muted:#5f6b85; --surface:#ffffff; --canvas:#f5f7fb; --brand:#4169e1; --line:#dce3f1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--canvas); line-height:1.65; }
    main { max-width:760px; margin:0 auto; padding:72px 24px; }
    .hero, .card { background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:0 8px 30px rgba(27,45,86,.06); }
    .hero { padding:42px; background:linear-gradient(135deg,#ffffff 0%,#eff4ff 100%); }
    .eyebrow { margin:0 0 10px; color:var(--brand); font-weight:700; letter-spacing:.08em; font-size:.78rem; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3.3rem); line-height:1.12; letter-spacing:-.04em; }
    .lead { margin:18px 0 0; color:var(--muted); font-size:1.08rem; }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:20px; }
    .card { padding:26px; color:inherit; text-decoration:none; transition:transform .15s ease, border-color .15s ease; }
    .card:hover { transform:translateY(-2px); border-color:#9fb4f8; }
    .card h2 { margin:0 0 8px; font-size:1.2rem; }
    .card p { margin:0; color:var(--muted); }
    footer { color:var(--muted); font-size:.9rem; margin:28px 4px 0; }
    a { color:var(--brand); }
    @media (prefers-color-scheme:dark) { :root { --ink:#edf2ff; --muted:#aeb9d0; --surface:#171d2b; --canvas:#0d111a; --line:#2c3750; } .hero { background:linear-gradient(135deg,#171d2b 0%,#18284e 100%); } }
    @media (max-width:560px) { main { padding:36px 16px; } .hero { padding:30px; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">LutraTally · 随时记</p>
      <h1>支持与隐私</h1>
      <p class="lead">这里提供 LutraTally 的隐私政策、技术支持与联系渠道。</p>
    </section>
    <section class="grid" aria-label="页面导航">
      <a class="card" href="privacy.html"><h2>隐私政策</h2><p>了解我们如何处理你的数据、权限与可选 iCloud 同步。</p></a>
      <a class="card" href="support.html"><h2>技术支持</h2><p>获取使用帮助、购买恢复说明与反馈方式。</p></a>
    </section>
    <footer>最后更新：2026 年 9 月 16 日 · 联系我们：<a href="mailto:lutratally@qq.com">lutratally@qq.com</a></footer>
  </main>
</body>
</html>
